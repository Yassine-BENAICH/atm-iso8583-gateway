<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #113b62; }
      .label { font: 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f7fbff; stroke: #9eb8cf; stroke-width: 2; }
      .uc { fill: #ffffff; stroke: #0f4c81; stroke-width: 2; }
      .actor { fill: #ffffff; stroke: #b88a1d; stroke-width: 2; }
      .line { stroke: #4b5563; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Figure 1 - Diagramme de cas d'utilisation</text>

  <rect x="260" y="90" width="590" height="560" rx="18" class="box"/>
  <text x="555" y="122" text-anchor="middle" class="label">ATM ISO 8583 Gateway</text>

  <ellipse cx="555" cy="190" rx="165" ry="38" class="uc"/>
  <text x="555" y="196" text-anchor="middle" class="label">Envoyer une transaction ISO 8583</text>

  <ellipse cx="555" cy="280" rx="165" ry="38" class="uc"/>
  <text x="555" y="286" text-anchor="middle" class="label">Consulter l'etat et la configuration</text>

  <ellipse cx="555" cy="370" rx="165" ry="38" class="uc"/>
  <text x="555" y="376" text-anchor="middle" class="label">Executer un test reseau (echo)</text>

  <ellipse cx="555" cy="460" rx="165" ry="38" class="uc"/>
  <text x="555" y="466" text-anchor="middle" class="label">Soumettre un direct debit XML</text>

  <ellipse cx="555" cy="550" rx="165" ry="38" class="uc"/>
  <text x="555" y="556" text-anchor="middle" class="label">Superviser le trafic et les erreurs</text>

  <circle cx="110" cy="210" r="24" class="actor"/>
  <line x1="110" y1="234" x2="110" y2="304" class="line"/>
  <line x1="70" y1="258" x2="150" y2="258" class="line"/>
  <line x1="110" y1="304" x2="72" y2="360" class="line"/>
  <line x1="110" y1="304" x2="148" y2="360" class="line"/>
  <text x="110" y="398" text-anchor="middle" class="label">Client API</text>
  <text x="110" y="422" text-anchor="middle" class="small">(Postman / Middleware / ATM)</text>

  <circle cx="1000" cy="230" r="24" class="actor"/>
  <line x1="1000" y1="254" x2="1000" y2="324" class="line"/>
  <line x1="960" y1="278" x2="1040" y2="278" class="line"/>
  <line x1="1000" y1="324" x2="962" y2="380" class="line"/>
  <line x1="1000" y1="324" x2="1038" y2="380" class="line"/>
  <text x="1000" y="418" text-anchor="middle" class="label">Switch bancaire</text>

  <circle cx="1000" cy="500" r="24" class="actor"/>
  <line x1="1000" y1="524" x2="1000" y2="594" class="line"/>
  <line x1="960" y1="548" x2="1040" y2="548" class="line"/>
  <line x1="1000" y1="594" x2="962" y2="650" class="line"/>
  <line x1="1000" y1="594" x2="1038" y2="650" class="line"/>
  <text x="1000" y="688" text-anchor="middle" class="label">Mock Switch</text>

  <line x1="150" y1="210" x2="390" y2="190" class="line"/>
  <line x1="150" y1="258" x2="390" y2="280" class="line"/>
  <line x1="150" y1="300" x2="390" y2="370" class="line"/>
  <line x1="150" y1="340" x2="390" y2="460" class="line"/>
  <line x1="150" y1="360" x2="390" y2="550" class="line"/>

  <line x1="720" y1="190" x2="955" y2="230" class="line"/>
  <line x1="720" y1="370" x2="955" y2="230" class="line"/>
  <line x1="720" y1="460" x2="955" y2="500" class="line"/>
