<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #113b62; }
      .host { fill: #f7fbff; stroke: #9eb8cf; stroke-width: 2; rx: 18; }
      .node { fill: #ffffff; stroke: #0f4c81; stroke-width: 2; rx: 16; }
      .label { font: 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">Figure 4 - Diagramme de deploiement</text>

  <rect x="60" y="250" width="220" height="140" class="node"/>
  <text x="170" y="308" text-anchor="middle" class="label">Client / Navigateur</text>
  <text x="170" y="336" text-anchor="middle" class="small">Postman / Dashboard / ATM Middleware</text>

  <rect x="360" y="120" width="430" height="400" class="host"/>
  <text x="575" y="155" text-anchor="middle" class="label">Host applicatif</text>

  <rect x="430" y="210" width="290" height="100" class="node"/>
  <text x="575" y="252" text-anchor="middle" class="label">Spring Boot Gateway</text>
  <text x="575" y="280" text-anchor="middle" class="small">REST API + ISO 8583 + Monitoring</text>

  <rect x="430" y="355" width="290" height="100" class="node"/>
  <text x="575" y="397" text-anchor="middle" class="label">Dashboard Angular</text>
  <text x="575" y="425" text-anchor="middle" class="small">Servi depuis /dashboard/</text>

  <rect x="880" y="170" width="260" height="120" class="host"/>
  <text x="1010" y="205" text-anchor="middle" class="label">Host switch</text>
  <rect x="920" y="225" width="180" height="50" class="node"/>
  <text x="1010" y="257" text-anchor="middle" class="label">Switch bancaire</text>

  <rect x="880" y="380" width="260" height="120" class="host"/>
  <text x="1010" y="415" text-anchor="middle" class="label">Host developpement</text>
  <rect x="920" y="435" width="180" height="50" class="node"/>
  <text x="1010" y="467" text-anchor="middle" class="label">Mock Switch</text>

  <path d="M280,320 C315,320 330,260 430,260" class="line"/>
  <path d="M280,320 C315,320 330,405 430,405" class="line"/>
  <path d="M720,260 C785,260 820,250 920,250" class="line"/>
  <path d="M720,280 C785,280 820,460 920,460" class="line"/>
</svg>
