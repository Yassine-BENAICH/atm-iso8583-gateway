server:
  port: 8080

spring:
  application:
    name: ATM ISO8583 Gateway
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:atm_iso8583
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        '[format_sql]': true
        '[jdbc.batch_size]': 20
        '[jdbc.fetch_size]': 50
  flyway:
    enabled: true
    baseline-on-migrate: true

# ISO 8583 Network Connection Configuration
iso8583:
  host: 127.0.0.1          # Target host (PowerCARD / switch)
  port: 9000                # Target port
  connect-timeout: 8080     # ms
  read-timeout: 30000       # ms
  header-length: 4          # bytes used for message length prefix
  institution-id: "000001"  # Institution identifier

# Logging
logging:
  level:
    root: INFO
    com.atm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/iso8583-gateway.log

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  '[endpoints.web.base-path]': /api/actuator
  endpoint:
    health:
      show-details: always

# Swagger UI
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method


