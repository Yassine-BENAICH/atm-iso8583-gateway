<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #113b62; }
      .box { fill: #ffffff; stroke: #0f4c81; stroke-width: 2; }
      .label { font: 15px Arial, sans-serif; fill: #1f2937; }
      .line { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; }
      .msg { stroke: #1f2937; stroke-width: 2; marker-end: url(#arrow); }
      .ret { stroke: #b88a1d; stroke-width: 2; marker-end: url(#arrow2); stroke-dasharray: 10 6; }
      .step { font: 14px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b88a1d"/>
    </marker>
  </defs>

  <text x="625" y="40" text-anchor="middle" class="title">Figure 3 - Diagramme de sequence d'une transaction</text>

  <rect x="70" y="70" width="150" height="50" class="box"/>
  <rect x="290" y="70" width="170" height="50" class="box"/>
  <rect x="535" y="70" width="170" height="50" class="box"/>
  <rect x="780" y="70" width="170" height="50" class="box"/>
  <rect x="1030" y="70" width="150" height="50" class="box"/>

  <text x="145" y="101" text-anchor="middle" class="label">Client</text>
  <text x="375" y="101" text-anchor="middle" class="label">Controller</text>
  <text x="620" y="101" text-anchor="middle" class="label">GatewayService</text>
  <text x="865" y="101" text-anchor="middle" class="label">Codec / Channel</text>
  <text x="1105" y="101" text-anchor="middle" class="label">Switch</text>

  <line x1="145" y1="120" x2="145" y2="840" class="line"/>
  <line x1="375" y1="120" x2="375" y2="840" class="line"/>
  <line x1="620" y1="120" x2="620" y2="840" class="line"/>
  <line x1="865" y1="120" x2="865" y2="840" class="line"/>
  <line x1="1105" y1="120" x2="1105" y2="840" class="line"/>

  <line x1="145" y1="170" x2="375" y2="170" class="msg"/>
  <text x="260" y="158" text-anchor="middle" class="step">1. POST /api/iso8583/send</text>

  <line x1="375" y1="250" x2="620" y2="250" class="msg"/>
  <text x="498" y="238" text-anchor="middle" class="step">2. Validation + delegation</text>

  <line x1="620" y1="330" x2="865" y2="330" class="msg"/>
  <text x="742" y="318" text-anchor="middle" class="step">3. Mapping + packing ISO 8583</text>

  <line x1="865" y1="410" x2="1105" y2="410" class="msg"/>
  <text x="985" y="398" text-anchor="middle" class="step">4. Envoi TCP/IP</text>

  <line x1="1105" y1="500" x2="865" y2="500" class="ret"/>
  <text x="985" y="488" text-anchor="middle" class="step">5. Reponse ISO 8583</text>

  <line x1="865" y1="590" x2="620" y2="590" class="ret"/>
  <text x="742" y="578" text-anchor="middle" class="step">6. Unpacking + decode</text>

  <line x1="620" y1="680" x2="375" y2="680" class="ret"/>
  <text x="498" y="668" text-anchor="middle" class="step">7. Reponse applicative</text>

  <line x1="375" y1="770" x2="145" y2="770" class="ret"/>
  <text x="260" y="758" text-anchor="middle" class="step">8. HTTP 200/4xx/5xx</text>
</svg>
